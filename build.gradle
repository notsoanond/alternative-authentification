plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

minecraft {
    mappings channel: 'official', version: project.minecraft_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                alternativeauth {
                    source sourceSets.main
                }
            }
        }
        server { }
        client { }
    }
}

repositories {
    maven { name = 'Sponge'; url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

mixin {
    add sourceSets.main, "alternative-auth.refmap.json"
    config "alternative-auth.mixins.json"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "forge_version", project.forge_version
    inputs.property "forge_version_range", project.forge_version_range
    inputs.property "minecraft_version_range", project.minecraft_version_range
    filesMatching('META-INF/mods.toml') {
        expand(
            'version': project.version,
            'minecraft_version': project.minecraft_version,
            'forge_version': project.forge_version,
            'forge_version_range': project.forge_version_range,
            'minecraft_version_range': project.minecraft_version_range,
            'loader_version_range': project.loader_version_range
        )
    }
}

jar {
    manifest {
        attributes([
            'Specification-Title'     : 'alternative-auth',
            'Specification-Vendor'    : 'GGSkyOne',
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.version,
            'Implementation-Vendor'   : 'GGSkyOne',
            'MixinConfigs'            : 'alternative-auth.mixins.json'
        ])
    }
    from('LICENSE') {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}
