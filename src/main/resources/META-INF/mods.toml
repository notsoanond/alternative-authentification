modLoader="javafml"
loaderVersion="${loader_version_range}"
license="MIT"
showAsResourcePack=false

[[mods]]
modId="alternative-auth"
version="${version}"
displayName="Alternative Authentication"
authors="GGSkyOne"
description='''Use third-party authentication servers, like Ely.by, on your server without interfering with Mojang authentication.'''
displayTest="MATCH_VERSION"

[[dependencies.alternative-auth]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="SERVER"

[[dependencies.alternative-auth]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="SERVER"
